<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reservation List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3eadc;
            margin: 0;
            padding: 50px;
        }

        .reservation-container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            background-color: #fffaf2;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(80, 60, 40, 0.15);
        }

        h2 {
            background-color: #cdbb9d;
            color: #4a3b2a;
            padding: 18px;
            margin: -25px -25px 20px -25px;
            border-radius: 15px 15px 0 0;
            font-size: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #dfd0b9;
            color: #4a3b2a;
            padding: 13px 10px;
            text-align: left;
        }

        td {
            padding: 13px 10px;
            border-bottom: 1px solid #e5d8c5;
            color: #5c5042;
        }

        tr:hover {
            background-color: #faf2e5;
        }

        .status {
            background-color: #eadfcf;
            color: #66533d;
            padding: 6px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="reservation-container">

    <h2>Reservation List</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Guest Name</th>
                <th>Contact Number</th>
                <th>Room Type</th>
                <th>Check In</th>
                <th>Check Out</th>
                <th>Guests</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>R001</td>
                <td>Aliah Mahinay</td>
                <td>09171234567</td>
                <td>Deluxe Room</td>
                <td>2026-10-05</td>
                <td>2026-10-08</td>
                <td>2</td>
                <td><span class="status">Confirmed</span></td>
            </tr>

            <tr>
                <td>R002</td>
                <td>Beth Ompong</td>
                <td>09281234567</td>
                <td>Double Room</td>
                <td>2026-10-10</td>
                <td>2026-10-12</td>
                <td>2</td>
                <td><span class="status">Pending</span></td>
            </tr>

        </tbody>
    </table>

</div>

</body>
</html>
